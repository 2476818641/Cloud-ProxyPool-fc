services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - default

  cloud-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DEPLOY_CONFIG_FILE: /app/config/deploy.toml
      CLIENT_CONFIG_PATH: /app/runtime/client.toml
      AUTO_DEPLOY_ON_START: "true"
      ENABLE_WEB_DASHBOARD: "${ENABLE_WEB_DASHBOARD:-true}"
      DASHBOARD_TLS_ENABLED: "${DASHBOARD_TLS_ENABLED:-false}"
      DASHBOARD_TLS_CERT_FILE: "${DASHBOARD_TLS_CERT_FILE:-/app/runtime/tls/dashboard.crt}"
      DASHBOARD_TLS_KEY_FILE: "${DASHBOARD_TLS_KEY_FILE:-/app/runtime/tls/dashboard.key}"
      DASHBOARD_USER: "${DASHBOARD_USER:-}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
    volumes:
      - ./config:/app/config
      - ./runtime:/app/runtime
    ports:
      - "10800-10810:10800-10810"
      - "${WEB_DASHBOARD_PORT:-8081}:8081"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      cloud-proxy:
        condition: service_started
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    profiles:
      - nginx-proxy

volumes:
  redis-data:
